name: Prueba de Python CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  ejecutar-codigo:
    runs-on: ubuntu-latest

    steps:
     
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

     
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     
      - name: Ejecutar script de suma
        run: python suma.py
